function dashboard(){let paid=state.orders.reduce((a,o)=>a+Number(o.paid||0),0)+state.cash.reduce((a,c)=>a+Number(c.amount||0),0);let expense=state.expenses.reduce((a,x)=>a+Number(x.amount||0),0);let profit=paid-expense;let waiting=state.orders.filter(o=>['À préparer','Confirmée','En production'].includes(o.status)).length;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10)});let bars=dates.map(d=>state.cash.filter(c=>c.date===d).reduce((sum,c)=>sum+Number(c.amount||0),0));let maxBar=Math.max(1,...bars);let alerts=state.ingredients.filter(x=>Number(x.qty)<=Number(x.threshold));let urgent=state.orders.filter(o=>o.date<=new Date(Date.now()+86400000).toISOString().slice(0,10)&&o.status!=='Livrée'&&o.status!=='Annulée');return `<section class="cards"><article class="card"><div class="cardtop">${t('sales')} <span class="trend">● ${state.cash.length+state.orders.length} ventes</span></div><div class="value">${money(paid)}</div><div class="footnote">${t('today')}</div></article><article class="card"><div class="cardtop">${t('ordersCount')} <span>▣</span></div><div class="value">${state.orders.length}</div><div class="footnote">${waiting} ${t('due')}</div></article><article class="card"><div class="cardtop">${t('expenses')} <span>↘</span></div><div class="value">${money(expense)}</div><div class="footnote">Dépenses enregistrées</div></article><article class="card"><div class="cardtop">${t('profit')} <span class="trend">≈</span></div><div class="value">${money(profit)}</div><div class="footnote">Encaissements − dépenses</div></article></section><div class="dashgrid"><section class="panel"><div class="panelhead"><div><h2>${t('weekSales')}</h2><small>Ventes caisse enregistrées · 7 derniers jours</small></div><select class="filter" id="period2"><option>Cette semaine</option><option>Ce mois</option></select></div><div class="bars">${bars.map((b,i)=>`<div class="barcol" title="${money(b)}"><div class="bar" style function badge(s){let c=s==='Livrée'||s==='Prête'?'green':s==='Annulée'?'red':s==='En production'?'purple':'orange';return `<span class="badge ${c}">${esc(s)}</span>`}function tools(id,kind){return `<span class="actions"><button class="smallbtn" data-edit="${kind}" data-id="${id}">${t('edit')}</button><button class="smallbtn" data-delete="${kind}" data-id="${id}">×</button></span>`}function table(headers,rows){if(!rows.length)return `<div class="empty">${t('empty')}</div>`;return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function orderTable(arr){return table([t('order'),t('customer'),t('date'),t('amount'),t('paid'),t('status'),t('actions')],arr.map(o=>`<tr><td><b>${esc(o.ref)}</b><br><small>${esc(o.channel||'')}</small></td><td>${esc(o.customer)}</td><td>${esc(o.date)}</td><td>${money(o.amount)}</td><td>${money(o.paid)}</td><td>${badge(o.status)}</td><td>${tools(o.id,'order')}</td></tr>`))}function sectionHead(add,filter=true){return `<div class="sectionbar">${filter?`<input class="search" id="search" placeholder="⌕ ${t('search')}" value="${esc(searchTerm)}">`:''}<button class="btn primary" data-add="${add}">${t('add')}</button></div>`}function match(x){return !searchTerm||JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())}
function productsView(){let prods=state.products.filter(match).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category||'—')}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${esc(p.qty)} ${esc(p.unit)}</td><td><span class="badge green">Actif</span></td><td>${tools(p.id,'product')}</td></tr>`);let recipes=state.recipes.filter(match).map(r=>{let c=recipeCost(r),u=c.total/Math.max(1,Number(r.yield||1)),sell=u/(1-Math.min(90,Math.max(0,Number(r.targetMargin||0)))/100);return `<article class="recipe-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><h3>${esc(r.name)}</h3><p>Rendement : ${esc(r.yield||1)} portion(s) · Version ${esc(r.version||1)}</p></div>${tools(r.id,'recipe')}</div><div class="recipe-metrics"><div><small>Coût total du lot</small><b>${money(c.total)}</b></div><div><small>Coût par portion</small><b>${money(u)}</b></div><div><small>Prix conseillé / portion</small><b>${money(sell)}</b></div><div><small>Marge cible</small><b>${esc(r.targetMargin||0)}%</b></div></div><p>Matières ${money(c.material)} · Emballage ${money(r.packaging)} · Main-d’œuvre ${money(r.labor)} · Charges ${money(r.overhead)}</p>${c.missing.length?`<div class="recipe-cost-warn">À vérifier : ${c.missing.map(esc).join(', ')}</div>`:''}<button class="smallbtn" data-scale="${r.id}">Calculer un autre rendement</button><div class="version-list">${(r.versions||[]).length?`Versions précédentes : ${(r.versions||[]).slice(-4).reverse().map(v=>`V${v.version} · ${esc(v.savedAt)} · ${money(v.costPerYield)} / portion`).join(' · ')}`:'Aucune ancienne version enregistrée.'}</div></article>`});return `<section class="panel"><div class="panelhead"><div><h2>Catalogue produits</h2><small>Prix, stock et fiches produits</small></div></div>${sectionHead('product')}${table([t('name'),t('category'),t('price'),t('cost'),'Stock',t('status'),t('actions')],prods)}</section><section class="panel"><div class="panelhead"><div><h2>Recettes & calcul de rentabilité</h2><small>Sous-recettes, rendement, coût complet et versionnage</small></div><button class="btn primary" data-add="recipe">＋ Créer une recette</button></div>${recipes.length?`<div class="recipegrid">${recipes}</div>`:`<div class="empty">Aucune recette enregistrée.</div>`}</section>`}function unitInfo(u){let x=String(u||'').trim().toLowerCase();if(['kg','kilogramme','kilogrammes'].includes(x))return ['weight',1000];if(['g','gr','gramme','grammes'].includes(x))return ['weight',1];if(['l','litre','litres'].includes(x))return ['volume',1000];if(['ml','millilitre','millilitres'].includes(x))return ['volume',1];if(['pc','pcs','pièce','pièces','piece','pieces','unité','unites','unité(s)','portion','portions'].includes(x))return ['count',1];return ['other:'+x,1]}function convertQty(q,from,to){let a=unitInfo(from),b=unitInfo(to);return a[0]===b[0]?Number(q)*a[1]/b[1]:null}function recipeCost(r,seen=new Set()){if(seen.has(r.id))return {total:0,material:0,missing:['boucle de sous-recette']};seen.add(r.id);let material=0,missing=[];(r.items||[]).forEach(x=>{if(x.type==='recipe'||x.recipeId){let sub=state.recipes.find(y=>y.id===(x.itemId||x.recipeId)||y.name===x.recipe);if(!sub){missing.push(x.recipe||x.ingredient||'sous-recette inconnue');return}if(unitInfo(x.unit)[0]!=='count'){missing.push(`${sub.name} (unité de portion attendue)`);return}let cc=recipeCost(sub,new Set(seen)),per=cc.total/Math.max(1,Number(sub.yield||1));material+=per*Number(x.qty||0);missing.push(...cc.missing)}else{let i=state.ingredients.find(y=>y.id===x.itemId||y.name===x.ingredient);if(!i){missing.push(x.ingredient||'matière inconnue');return}let q=convertQty(x.qty,x.unit||i.unit,i.unit);if(q===null){missing.push(`${i.name} (${x.unit} incompatible)`);return}material+=Number(i.cost||0)*q}});return {material,total:material+Number(r.packaging||0)+Number(r.labor||0)+Number(r.overhead||0),missing}}

,'Payé','Statut','Canal'];let lines=state.orders.map(o=>[o.ref,o.customer,o.date,o.amount,o.paid,o.status,o.channel]);download([head,...lines].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n'),'patisspro-commandes.csv','text/csv;charset=utf-8');};let clear=$('#clearBtn');if(clear)clear.onclick=()=>{if(confirm('Effacer toutes les données locales et réinitialiser la démonstration ?')){localStorage.removeItem(KEY);state=demoData();save();toast('Données de démonstration réinitialisées.')}}}
